name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://zhixue_ci@127.0.0.1:15432/zhixue_ci
      REDIS_URL: redis://127.0.0.1:16379
      APP_ORIGIN: http://127.0.0.1:3000
      AI_ENABLED: "false"
      AI_IMAGE_ENABLED: "false"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zhixue_ci
          POSTGRES_DB: zhixue_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:15432:5432"
        options: >-
          --health-cmd "pg_isready -U zhixue_ci -d zhixue_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - "127.0.0.1:16379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure temporary test services
        run: |
          access_key=$(openssl rand -hex 32)
          refresh_key=$(openssl rand -hex 32)
          echo "::add-mask::$access_key"
          echo "::add-mask::$refresh_key"
          {
            echo "JWT_ACCESS_SECRET=$access_key"
            echo "JWT_REFRESH_SECRET=$refresh_key"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations to the test database
        run: npm run db:deploy

      - name: Run project verification
        run: npm run verify
