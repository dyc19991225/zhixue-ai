# Local container packaging recipe. Not started automatically; production requires HTTPS.
services:
  api:
    build:
      context: .
      target: api
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      TRUST_PROXY: "1"
      AUTH_COOKIE_SECURE: "true"
      MEDIA_DIRECTORY: /app/.local-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - local_media:/app/.local-media
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    profiles: ["app"]
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
volumes:
  local_media:
